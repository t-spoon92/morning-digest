<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Digest · Tallie</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f4f1;
      --surface:   #ffffff;
      --border:    #e4e3df;
      --text:      #1a1a18;
      --muted:     #6b6b67;
      --subtle:    #f0efe9;

      /* Topic accents */
      --c-ai:       #5b5ef4;
      --c-org:      #0891b2;
      --c-beh:      #d97706;
      --c-fun:      #db2777;
      --c-psy:      #059669;

      --t-ai:       #eef2ff;
      --t-org:      #ecfeff;
      --t-beh:      #fffbeb;
      --t-fun:      #fdf2f8;
      --t-psy:      #ecfdf5;

      --radius:     12px;
      --shadow:     0 1px 3px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header-left h1 span { color: var(--muted); font-weight: 400; }
    #last-updated { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      border: 1.5px solid var(--border);
      background: var(--surface);
      border-radius: 999px;
      padding: 4px 13px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
      white-space: nowrap;
    }
    .pill:hover { border-color: #aaa; color: var(--text); }
    .pill.active { color: #fff; border-color: transparent; }
    .pill[data-f="all"].active            { background: var(--text); }
